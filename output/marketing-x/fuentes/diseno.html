</style></head><body><main id="art"></main><script>
const q=new URLSearchParams(location.search), id=q.get('scene')||'0', plate=q.get('plate')==='1';
const phone=(file,cls='',style='')=>`<div class="phone ${cls}" style="${style}"><div class="screen">${plate?'':`<img src="../capturas/${file}.jpg" alt="Captura real de Outfit Roulette">`}</div></div>`;
const brand=`<div class="brand"><img src="../recursos/icono.png"><span>OUTFIT ROULETTE</span></div>`;
const base=(theme,kicker,title,desc,extra,visual,n,caption='')=>{document.querySelector('#art').className=theme;document.querySelector('#art').innerHTML=`<div class="orb"></div><div class="glow"></div>${brand}<div class="edition">TU ROPA. NUEVAS COMBINACIONES.</div><div class="copy"><div class="kicker">${kicker}</div><h1>${title}</h1><div class="description">${desc}</div>${extra||''}</div>${visual}<div class="caption">${caption}</div><div class="line"><i style="width:${n/9*100}%"></i></div><div class="footer"><span>GRATIS PARA ANDROID · SIN CUENTA</span><span>${String(n).padStart(2,'0')} / 09</span></div>`};
const chips=(items)=>'<div class="chips">'+items.map(t=>'<span class="chip">'+t+'</span>').join('')+'</div>';
switch(id){
case '0':base('dark','¿OTRA VEZ EL MISMO LOOK?','Tu ropa.<br><span class="accent">Más<br>posibilidades.</span>','Redescubre lo que ya tienes.<br>Encuentra qué ponerte hoy.',chips(['Tu armario','Nuevos looks','A tu gusto']),phone('ruleta-hero'),1);break;
case '1':base('','01 · EMPIEZA CON TU ROPA','Tu armario,<br>en el bolsillo.','Elige tus prendas desde el catálogo<br>y personaliza su color.',chips(['Básicos','Colores','Categorías']),phone('armario')+'<div class="spot"><strong>Todo empieza con lo que ya tienes.</strong><p>Polo, jean, zapatillas o una camisa<br>lavanda. Tú eliges.</p></div>',2);break;
case '2':base('','02 · SEGÚN TU DÍA','Tu plan.<br>Tu clima.<br>Tu look.','Combina según la ocasión,<br>la temperatura y los colores.',chips(['Clases','Salida','Fiesta','Gym']),phone('ruleta-hero')+'<div class="spot"><strong>Lima · 23°</strong><p>Elige una ciudad para adaptar<br>tus combinaciones al clima.</p></div>',3);break;
case '3':base('green','03 · DEJA QUE LA RULETA TE INSPIRE','Gira.<br><span class="accent">Descubre.<br>Repite.</span>','Nuevas combinaciones<br>con tus propias prendas.',chips(['Un toque','Otro look']),phone('ruleta-hero'),4,'Secuencia real del giro en el app.');break;
case '4':base('','04 · DALE TU TOQUE','Esa prenda,<br>se queda.','Bloquea tu favorita y vuelve a girar.<br>O desliza para cambiar una prenda.',chips(['Fijar','Deslizar','Volver a girar']),phone('bloqueo'),5,'El candado conserva la prenda en el siguiente giro.');break;
case '5':base('','05 · TUS COMBINACIONES FAVORITAS','Un buen look<br>merece<br>guardarse.','Ponle nombre y vuelve a usarlo<br>desde tu Lookbook.',chips(['Guardar','Cargar','Compartir como texto']),phone('look-detalle')+'<div class="cutout"><img src="../capturas/lookbook.jpg"></div>',6);break;
case '6':base('','06 · TU ROPA, ORGANIZADA','Cada prenda,<br>en su lugar.','Marca tus prendas favoritas.<br>La ropa en lavandería queda<br>fuera de los giros.',chips(['Favoritos','Lavandería','Registro de uso']),phone('lavanderia'),7);break;
case '7':base('dark','07 · A TU MANERA','Hazla tuya.','Temas, colores, idioma y modo caos.<br>Tu armario se guarda en tu dispositivo.',chips(['Sin registro','Respaldo exportable']),phone('ajustes'),8,'Todas las funciones son gratis. Clima opcional.');break;
case '8':base('dark cta','TU ROPA. NUEVAS COMBINACIONES.','Dale un giro<br><span class="accent">a tu armario.</span>','Outfit Roulette<br>Gratis para Android. Sin cuenta.','<div class="button">Descarga en GitHub <span class="arrow">↗</span></div><div class="url">github.com/JasonS-V/<br>Outfit-Roullete</div>',phone('armario','mini')+phone('ruleta-hero'),9,'APK disponible en Releases.');break;
case 'poster1':base('dark poster','TU ARMARIO, REINVENTADO','Tu ropa.<br><span class="accent">Más<br>posibilidades.</span>','Gira la ruleta y encuentra un look<br>con la ropa que ya tienes.',chips(['Ocasión + clima','A tu gusto'])+'<div class="button">Descarga en GitHub <span class="arrow">↗</span></div>',phone('armario','back')+phone('ruleta-hero','main')+'<div class="star">✦</div>',9,'Gratis para Android · Sin cuenta');document.querySelector('.footer').innerHTML='<span>github.com/JasonS-V/Outfit-Roullete</span><span>01 / 02</span>';break;
case 'poster2':base('poster2','UN ARMARIO. MUCHAS POSIBILIDADES.','Un giro.<br>Un nuevo look.','Elige tu ocasión. Fija la prenda que te gusta.<br>Guarda la combinación y vuelve a usarla.',chips(['Gira','Ajusta','Guarda']),phone('bloqueo')+'<div class="cutout"><img src="../capturas/lookbook.jpg"></div>',9,'Descarga gratis para Android en GitHub.');document.querySelector('.footer').innerHTML='<span>github.com/JasonS-V/Outfit-Roullete</span><span>02 / 02</span>';break;
}
</script></body></html>
