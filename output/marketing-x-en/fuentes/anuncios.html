<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Outfit Roulette · English campaign</title>
<style>
@font-face{font-family:Inter;src:url('../recursos/Inter-Regular.ttf');font-weight:400}@font-face{font-family:Inter;src:url('../recursos/Inter-Bold.ttf');font-weight:700}@font-face{font-family:Inter;src:url('../recursos/Inter-ExtraBold.ttf');font-weight:800}
*{box-sizing:border-box}html,body{margin:0;width:2400px;height:2400px;background:#24182f;font-family:Inter,sans-serif}.export{width:2400px;height:2400px;position:relative;overflow:hidden}#art{position:absolute;left:0;top:0;width:1200px;height:1200px;transform:scale(2);transform-origin:0 0;background:#f7f6f1;color:#24312c;overflow:hidden}.dark{background:#24182f!important;color:#f7f6f1!important}
.orb{position:absolute;width:850px;height:850px;border:1px solid #b8b5b126;border-radius:50%;right:-260px;top:165px}.orb:after{content:'';position:absolute;inset:90px;border:1px solid #b8b5b120;border-radius:50%}.glow{position:absolute;right:-150px;top:90px;width:820px;height:1040px;background:radial-gradient(ellipse,#b6a5c431,transparent 67%)}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:18px;font-size:21px;font-weight:700;letter-spacing:2px}.brand img{width:60px;height:60px;border-radius:15px}.edition{position:absolute;right:74px;top:87px;font-size:14px;letter-spacing:2.5px;color:#8d998f}.dark .edition{color:#c0b2ce}.copy{position:absolute;left:72px;top:258px;width:535px}.kicker{font-size:17px;font-weight:700;letter-spacing:2.8px;color:#7c8c81;margin-bottom:28px}.dark .kicker{color:#c7b4d8}h1{font-size:77px;letter-spacing:-4.3px;line-height:1.08;margin:0 0 35px;font-weight:800}.accent{color:#bdacd0}.description{font-size:27px;line-height:1.5;color:#66716a}.dark .description{color:#d3cdd5}.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:33px;max-width:520px}.chip{font-size:17px;border:1px solid #a8afa94a;border-radius:30px;padding:13px 19px}.dark .chip{border-color:#bda9ce60}.button{display:inline-flex;align-items:center;gap:24px;padding:22px 32px;margin-top:34px;border-radius:42px;background:#e2d6ee;color:#24182f;font-size:24px;font-weight:700}.arrow{font-size:28px}
.phone{position:absolute;border-radius:38px;background:linear-gradient(135deg,#5a635e,#171b18 26%,#404840 65%,#161917);box-shadow:0 34px 70px #111a1533,0 2px 3px #ffffff77 inset;transform-origin:center}.screen{position:relative;border-radius:28px;overflow:hidden;background:#f7f6f1}.screen img{width:100%;height:100%;object-fit:fill;display:block}.phone:after{content:'';position:absolute;bottom:15px;left:calc(50% - 44px);width:88px;height:4px;background:#949b9544;border-radius:4px}.main{left:768px;top:158px;transform:rotate(7deg);width:376px;height:814px;padding:11px}.main .screen{width:354px;height:767px}.back{left:591px;top:373px;transform:rotate(-9deg);width:304px;height:660px;padding:10px;border-radius:34px}.back .screen{width:284px;height:616px;border-radius:25px}.star{position:absolute;color:#c7b4d8;font-size:76px;left:655px;top:175px}.caption{position:absolute;left:72px;bottom:119px;font-size:19px;color:#7b857e}.dark .caption{color:#c8bfce}.footer{position:absolute;left:72px;right:72px;bottom:52px;display:flex;justify-content:space-between;font-size:15px;letter-spacing:1.2px;color:#819087}.dark .footer{color:#c4b6d0}.line{position:absolute;left:72px;right:72px;bottom:86px;height:1px;background:#adbbb344}.line:after{content:'';display:block;height:2px;width:100%;background:#9c82b4}
.second .copy{top:235px;width:610px}.second h1{font-size:85px}.second .description{font-size:27px;max-width:550px}.second .phone{left:746px;top:154px;transform:rotate(5deg);width:406px;height:880px;padding:11px}.second .phone .screen{width:384px;height:832px}.cutout{position:absolute;left:72px;top:730px;width:580px;height:272px;border:1px solid #d2d8cf;border-radius:22px;overflow:hidden;box-shadow:0 16px 40px #24312c0d;background:#f7f6f1}.cutout img{width:580px;display:block;transform:translateY(-241px)}.label{position:absolute;left:73px;top:686px;font-size:16px;letter-spacing:2.5px;color:#7c8c81;font-weight:700}
</style></head><body><div class="export"><main id="art"></main></div><script>
const id=new URLSearchParams(location.search).get('image')||'1';
const phone=(file,cls)=>`<div class="phone ${cls}"><div class="screen"><img src="../capturas/${file}-hd.jpg" alt="Actual Outfit Roulette interface in English"></div></div>`;
const brand='<div class="brand"><img src="../recursos/icono.png"><span>OUTFIT ROULETTE</span></div>';
const chips=items=>'<div class="chips">'+items.map(t=>'<span class="chip">'+t+'</span>').join('')+'</div>';
const art=document.querySelector('#art');
const base='<div class="orb"></div><div class="glow"></div>'+brand+'<div class="edition">YOUR CLOTHES. NEW COMBINATIONS.</div>';
if(id==='1'){
art.className='dark';art.innerHTML=base+'<div class="copy"><div class="kicker">YOUR WARDROBE, REIMAGINED</div><h1>Same clothes.<br><span class="accent">Fresh outfits.</span></h1><div class="description">Find new combinations in the<br>clothes you already own.</div>'+chips(['Occasion + weather','Made with your clothes'])+'<div class="button">Get it on GitHub <span class="arrow">↗</span></div></div>'+phone('wardrobe','back')+phone('roulette','main')+'<div class="star">✦</div><div class="caption">Free for Android · No account needed</div><div class="line"></div><div class="footer"><span>github.com/JasonS-V/Outfit-Roullete</span><span>01 / 02</span></div>';
}else{
art.className='second';art.innerHTML=base+'<div class="copy"><div class="kicker">YOUR NEXT LOOK STARTS WITH A SPIN</div><h1>Spin it.<br>Make it yours.</h1><div class="description">Lock the pieces you love.<br>Save your favorite combinations.</div>'+chips(['Spin','Lock','Save'])+'</div>'+phone('locked','main')+'<div class="label">KEEP THE LOOKS YOU LOVE</div><div class="cutout"><img src="../capturas/lookbook-hd.jpg" alt="Your saved outfits"></div><div class="caption">Free for Android. Download on GitHub.</div><div class="line"></div><div class="footer"><span>github.com/JasonS-V/Outfit-Roullete</span><span>02 / 02</span></div>';
}
</script></body></html>
